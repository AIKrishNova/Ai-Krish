<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>AI KRISH is offline</title>
<style>
  :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #475569; --accent: #2563eb; --btn-fg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1220; --fg: #e2e8f0; --muted: #94a3b8; --accent: #60a5fa; --btn-fg: #0b1220; }
  }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 22rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 1.5rem; }
  button { font: inherit; font-weight: 600; padding: .75rem 1.5rem; border: 0; border-radius: .75rem; background: var(--accent); color: var(--btn-fg); cursor: pointer; }
</style>
</head>
<body>
<main>
<h1>You’re offline</h1>
<p>AI KRISH needs an internet connection to chat. Check your connection, then try again.</p>
<button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
