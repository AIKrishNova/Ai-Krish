[project]
name = "nexus-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"
# Versions are floors; pin exact versions with a lock file (uv lock / pip-compile)
# after the first successful install. NOT yet installed or verified in this workspace.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "aiosqlite>=0.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false